<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#79caff"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e7f1ff} .ttl{font-size:26px;font-weight:bold} .sm{font-size:15px;fill:#c2d7ec} .body{font-size:19px;font-weight:bold}.label{font-size:14px;fill:#94c4df}.line{stroke:#79caff;stroke-width:3;fill:none;marker-end:url(#a)} .tile{fill:#19263a;stroke:#44658b;stroke-width:2;rx:14} .fx{fill:#143f3a;stroke:#54b8a5;stroke-width:2;rx:12}</style></defs>
<rect width="1280" height="720" fill="#0c1221"/><text x="44" y="50" class="ttl">HPDG FX ADD-ON · One layer DSP routing (B = PRE-EQ)</text><text x="44" y="78" class="sm">Principle: the complete layer EQ runs BEFORE all frequency-selective effect nodes.</text>
<rect x="35" y="142" width="170" height="75" class="tile"/><text x="120" y="176" text-anchor="middle" class="body">AUDIO IN</text><text x="120" y="199" text-anchor="middle" class="sm">Mono / Stereo</text>
<path class="line" d="M205 179H250"/><rect x="252" y="142" width="207" height="75" class="tile"/><text x="355" y="172" text-anchor="middle" class="body">PRE-EQ</text><text x="355" y="195" text-anchor="middle" class="sm">Bell / Cut / 96 dB/oct</text>
<path class="line" d="M459 179H507"/><rect x="509" y="142" width="205" height="75" class="tile"/><text x="612" y="172" text-anchor="middle" class="body">REFERENCE BUS</text><text x="612" y="195" text-anchor="middle" class="sm">xEQ · aligned dry</text>
<path class="line" d="M714 179H1003"/><rect x="1005" y="142" width="220" height="75" class="tile"/><text x="1115" y="172" text-anchor="middle" class="body">SUM / OUTPUT</text><text x="1115" y="195" text-anchor="middle" class="sm">xEQ + Σ (wet × delta)</text>
<path class="line" d="M612 217V287H182V313"/><path class="line" d="M612 287H456V313"/><path class="line" d="M612 287H729V313"/><path class="line" d="M612 287H1001V313"/>
<rect x="70" y="315" width="224" height="120" class="fx"/><text x="182" y="348" text-anchor="middle" class="body">FX NODE A</text><text x="182" y="376" text-anchor="middle" class="sm">250–700 Hz</text><text x="182" y="402" text-anchor="middle" class="sm">Compressor / ΔA</text>
<rect x="344" y="315" width="224" height="120" class="fx"/><text x="456" y="348" text-anchor="middle" class="body">FX NODE B</text><text x="456" y="376" text-anchor="middle" class="sm">450–1200 Hz</text><text x="456" y="402" text-anchor="middle" class="sm">Saturation / ΔB</text>
<rect x="617" y="315" width="224" height="120" class="fx"/><text x="729" y="348" text-anchor="middle" class="body">FX NODE C</text><text x="729" y="376" text-anchor="middle" class="sm">3–8 kHz</text><text x="729" y="402" text-anchor="middle" class="sm">Reverb / wet return</text>
<rect x="889" y="315" width="224" height="120" class="fx"/><text x="1001" y="348" text-anchor="middle" class="body">FX NODE D</text><text x="1001" y="376" text-anchor="middle" class="sm">8–16 kHz</text><text x="1001" y="402" text-anchor="middle" class="sm">Monsta FX / ΔD</text>
<path d="M182 435V480H1115V217" stroke="#79caff" stroke-width="2.8" fill="none" marker-end="url(#a)"/><path d="M456 435V480M729 435V480M1001 435V480" stroke="#79caff" stroke-width="2.8" fill="none"/>
<rect x="49" y="555" width="1180" height="119" rx="14" fill="#172336" stroke="#47678e"/><text x="73" y="592" class="body">Correctness invariants</text><text x="73" y="621" class="sm">• EQ is never moved after an FX node in the V1 signal graph.  • All node and reference latencies are aligned.</text><text x="73" y="647" class="sm">• Bypassed node contributes ZERO delta. • Overlap is allowed, but headroom and peak metering are required.</text></svg>